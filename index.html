<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#d32f2f">
    <title>DBP Video Player</title>
    
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --dbp-red: #d32f2f;
            --dbp-dark: #121212;
            --dbp-surface: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--dbp-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background-color: var(--dbp-surface);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--dbp-red);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-main);
            margin: 0;
        }

        .brand-logo span {
            color: var(--dbp-red);
        }

        #installBtn {
            display: none; 
            background-color: var(--dbp-red);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        main {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* Fixed Mobile-friendly File Upload */
        .upload-wrapper {
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-upload {
            display: block;
            border: 2px dashed var(--dbp-red);
            color: var(--dbp-red);
            background-color: transparent;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            width: 100%;
            text-align: center;
            cursor: pointer;
            box-sizing: border-box;
        }

        #videoUpload {
            display: none; /* Hidden strictly through CSS, label triggers it */
        }

        /* Fixed Vertical Video overflow */
        video {
            width: 100%;
            max-height: 50vh; /* Prevents vertical videos from taking over the screen */
            object-fit: contain;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: none;
        }

        .controls-container {
            width: 100%;
            background: var(--dbp-surface);
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .speed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .speed-value {
            color: var(--dbp-red);
            font-size: 1.3rem;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 5px;
            outline: none;
            margin: 15px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--dbp-red);
            cursor: pointer;
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .preset-buttons button {
            flex: 1 1 calc(33% - 10px);
            min-width: 70px;
            padding: 12px 5px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .preset-buttons button:active {
            background: var(--dbp-red);
        }

        .shortcuts-hint {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="brand-logo">DBP <span>PLAYER</span></h1>
        <button id="installBtn">📲 Install App</button>
    </header>

    <main>
        <div class="upload-wrapper">
            <label class="btn-upload" for="videoUpload">Tap to Choose Video</label>
            <input type="file" id="videoUpload" accept="video/*">
        </div>

        <video id="videoPlayer" controls playsinline></video>

        <div class="controls-container" id="controlsPanel">
            <div class="speed-header">
                <span>Playback Speed</span>
                <span class="speed-value" id="speedDisplay">1.00x</span>
            </div>
            
            <input type="range" id="speedSlider" min="0.1" max="3" step="0.05" value="1">
            
            <div class="preset-buttons">
                <button onclick="setSpeed(0.1)">0.10x</button>
                <button onclick="setSpeed(0.5)">0.50x</button>
                <button onclick="setSpeed(1.0)">1.00x</button>
                <button onclick="setSpeed(1.5)">1.50x</button>
                <button onclick="setSpeed(2.0)">2.00x</button>
                <button onclick="setSpeed(3.0)">3.00x</button>
            </div>
        </div>

        <div class="shortcuts-hint">
            <strong>Shortcuts:</strong><br>
            Space/K: Play/Pause • F: Fullscreen • M: Mute<br>
            J/L: -10s / +10s • Arrows: ±5s / Volume<br>
            &lt; / &gt;: Speed Down / Up
        </div>
    </main>

    <script>
        const videoUpload = document.getElementById('videoUpload');
        const videoPlayer = document.getElementById('videoPlayer');
        const speedSlider = document.getElementById('speedSlider');
        const speedDisplay = document.getElementById('speedDisplay');
        const controlsPanel = document.getElementById('controlsPanel');
        const installBtn = document.getElementById('installBtn');

        let deferredPrompt;

        // PWA Install Logic
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        installBtn.style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        });

        // File Upload Logic
        videoUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                videoPlayer.src = fileURL;
                videoPlayer.style.display = 'block';
                controlsPanel.style.display = 'flex';
                setSpeed(1);
                videoPlayer.play();
                
                // Clear the input so you can upload the same file again if needed
                videoUpload.value = '';
            }
        });

        // Speed Logic
        speedSlider.addEventListener('input', (e) => setSpeed(e.target.value));

        function setSpeed(speed) {
            // Fixes Javascript decimal math errors (e.g., 1.050000001)
            let numSpeed = Math.round(parseFloat(speed) * 100) / 100; 
            
            if (numSpeed < 0.1) numSpeed = 0.1;
            if (numSpeed > 3.0) numSpeed = 3.0;

            videoPlayer.playbackRate = numSpeed;
            speedSlider.value = numSpeed;
            speedDisplay.textContent = numSpeed.toFixed(2) + 'x';

            // Bug fix: Remove focus from buttons/sliders so spacebar doesn't double-trigger
            if (document.activeElement) {
                document.activeElement.blur();
            }
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (!videoPlayer.src) return;

            // Prevent page scrolling on standard media keys
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }

            switch(e.key.toLowerCase()) {
                case ' ':
                case 'k':
                    videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause();
                    break;
                case 'f':
                    if (!document.fullscreenElement) {
                        videoPlayer.requestFullscreen().catch(err => console.log(err));
                    } else {
                        document.exitFullscreen();
                    }
                    break;
                case 'j':
                    videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 10);
                    break;
                case 'l':
                    videoPlayer.currentTime += 10;
                    break;
                case 'm':
                    videoPlayer.muted = !videoPlayer.muted;
                    break;
                case 'arrowleft':
                    videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 5);
                    break;
                case 'arrowright':
                    videoPlayer.currentTime += 5;
                    break;
                case 'arrowup':
                    videoPlayer.volume = Math.min(1, videoPlayer.volume + 0.1);
                    break;
                case 'arrowdown':
                    videoPlayer.volume = Math.max(0, videoPlayer.volume - 0.1);
                    break;
                case '<':
                case ',':
                    setSpeed(videoPlayer.playbackRate - 0.05);
                    break;
                case '>':
                case '.':
                    setSpeed(videoPlayer.playbackRate + 0.05);
                    break;
            }
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('SW registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
